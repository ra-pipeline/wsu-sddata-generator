# pyproject.toml for wsu-sddata-generator
# Please update authors, license and project urls as needed.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsu-sddata-generator"
version = "1.0.0"
description = "Data Generator for ALMA-WSU SD."
readme = "README.md"
requires-python = ">=3.12"
authors = [ { name = "Takeshi Nakazato" } ]
license = { text = "UNKNOWN" }

dependencies = [
    "numpy",
    "scipy",
    "casatools",
    "casatasks",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
"Upstream Repository" = "https://github.com/tnakazato/wsu-sddata-generator"

[project.scripts]
wsusd = "wsusd.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wsusd*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q"
python_files = ["test_*.py"]
norecursedirs = [".*", "build", "dist", "*.egg-info", "scripts", "working", ".venv"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]

[dependency-groups]
dev = [
    "pytest>=6.0",
]

[[tool.uv.index]]
name = "nrao"
url = "https://casa-pip.nrao.edu/repository/pypi-group/simple"
explicit = true

[tool.uv.sources]
casatools = [
    { url = "https://casa-pip.nrao.edu/repository/pypi-group/packages/casatools/6.7.7.10/casatools-6.7.7.10-cp312-cp312-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "nrao", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]
casatasks = { index = "nrao" }

[tool.uv]
link-mode = "copy"
